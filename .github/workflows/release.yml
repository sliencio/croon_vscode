name: 发布 VS Code 插件

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的已有版本标签
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: 校验版本
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::标签 $RELEASE_TAG 与插件版本 $version 不一致"
            exit 1
          fi
      - name: 安装打包依赖
        run: npm ci
      - name: 检查 JavaScript
        run: npm run check
      - name: 运行测试
        run: npm test
      - name: 打包 VSIX
        run: npm run package
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="croon-vscode-${RELEASE_TAG#v}.vsix"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Croon ${RELEASE_TAG}"
          fi
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          if ! grep -Fxq "$asset" <<< "$assets"; then
            gh release upload "$RELEASE_TAG" "$asset"
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
